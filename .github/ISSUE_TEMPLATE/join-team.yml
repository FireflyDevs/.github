name: 加入流萤的秘密基地
description: 想认识同好、一起聊天一起玩？不需要经验，欢迎加入
title: "[加入流萤的秘密基地] "
labels: ["加入流萤的秘密基地"]
body:
  - type: markdown
    attributes:
      value: |
        这里是流萤的秘密基地，不是招聘，也没有能力门槛。

        会不会写代码、会不会设计、有没有作品，都不重要。
        只要你喜欢流萤、愿意友善相处，就可以来。
        想聊天、看图、潜水、学习，或者暂时什么都不会，也欢迎。

        不用写计划，不用交作品，打个招呼就可以。

  - type: input
    id: nickname
    attributes:
      label: 怎么称呼你？
      description: GitHub 用户名、昵称、QQ 昵称都可以
      placeholder: 随便写一个方便称呼你的名字
    validations:
      required: false

  - type: checkboxes
    id: mood
    attributes:
      label: 你想怎么参与？
      description: 随便选，选“还没想好”也完全没问题
      options:
        - label: 先来聊天、潜水、看看大家
        - label: 一起看图、收图、分享流萤相关内容
        - label: 想学做网站 / 开发
        - label: 想做设计、画画或做视频
        - label: 想整理资料、写文案或做测试
        - label: 还没想好，先加入再说
    validations:
      required: false

  - type: textarea
    id: hello
    attributes:
      label: 随便说点什么
      description: 比如你最喜欢流萤的哪句台词、哪张图，或者只是来打个招呼
      placeholder: 你好，我是……
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: 怎么联系你？
      description: 可选，可以填 QQ、邮箱或其他联系方式；如果只想通过 GitHub 联系，留空即可
      placeholder: 可选
    validations:
      required: false

  - type: checkboxes
    id: agreement
    attributes:
      label: 最后
      options:
        - label: 我会友善对待其他同好，尊重不同的喜好和作品
    validations:
      required: false
